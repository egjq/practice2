plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mars.simpleepubreader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mars.simpleepubreader'
        minSdk 23
        targetSdk 23
        versionCode 1
        versionName '1.0-mars'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

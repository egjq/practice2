plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mars.simpleepubreader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mars.simpleepubreader.reader7'
        minSdk 23
        targetSdk 23
        versionCode 7
        versionName '1.6-mars-reader7'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
}